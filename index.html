<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สื่อการเรียนรู้หุ่นยนต์ ROBOCART</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Font: Prompt & Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      --bg-color: #f8fafc;
      --card-radius: 16px;
      --card-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
    }
    
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: var(--bg-color);
      color: #1e293b;
    }

    h1, h2, h3, h4, h5, h6, .font-heading {
      font-family: 'Prompt', sans-serif;
    }

    /* Navbar UI */
    .navbar {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-bottom: 3px solid #3b82f6;
    }

    /* Custom Card Style */
    .custom-card {
      border: 1px solid #e2e8f0;
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      background: #ffffff;
    }

    /* Lesson Sidebar Nav */
    .lesson-nav .nav-link {
      color: #64748b;
      font-weight: 500;
      font-family: 'Prompt', sans-serif;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 8px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid transparent;
      background-color: #f8fafc;
    }

    .lesson-nav .nav-link:hover {
      background-color: #e0e7ff;
      color: var(--primary-color);
      transform: translateX(4px);
    }

    .lesson-nav .nav-link.active {
      background: var(--primary-gradient);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      border-color: transparent;
    }

    /* Teacher Section & Solution Card Design */
    .teacher-section {
      background: linear-gradient(180deg, #ecfdf5 0%, #f0fdf4 100%);
      border: 2px dashed #10b981;
      border-radius: var(--card-radius);
    }

    .teacher-card {
      border: 1px solid #a7f3d0;
      border-radius: 14px;
      background: #ffffff;
      transition: all 0.2s ease;
    }

    .teacher-card:hover {
      box-shadow: 0 6px 16px -2px rgba(16, 185, 129, 0.12);
      transform: translateY(-2px);
    }

    /* Frame แสดงรูปภาพ Block Code เฉลย */
    .solution-img-wrapper {
      position: relative;
      background-color: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      padding: 12px;
      text-align: center;
      overflow: hidden;
    }

    .solution-img-preview {
      max-height: 480px;
      width: 100%;
      object-fit: contain;
      border-radius: 8px;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    /* Video Container */
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 14px;
      box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.15);
      background: #000;
    }
    
    .video-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }

    /* Form Controls & Buttons */
    .form-control {
      border-radius: 10px;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
    }

    .btn-custom-primary {
      background: var(--primary-gradient);
      color: white;
      border-radius: 10px;
      font-weight: 600;
      font-family: 'Prompt', sans-serif;
      border: none;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
    }
    .btn-custom-primary:hover {
      color: white;
      opacity: 0.95;
    }

    .badge-chapter {
      background-color: #eff6ff;
      color: #1d4ed8;
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark mb-4 py-3 shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="#">
      <i class="bi bi-robot text-warning fs-3"></i> 
      <span>ROBOCART <small class="fs-6 fw-normal text-light opacity-75">Learning Center</small></span>
    </a>
    
    <div class="d-flex gap-2">
      <button class="btn btn-warning rounded-pill px-3 shadow-sm fw-bold text-dark d-flex align-items-center gap-1" id="btnTeacherLogin" onclick="openTeacherModal()">
        <i class="bi bi-person-badge-fill"></i> โหมดคุณครู
      </button>

      <a href="admin.html" class="btn btn-outline-light rounded-pill px-3 shadow-sm d-flex align-items-center gap-1">
        <i class="bi bi-gear-fill"></i> จัดการระบบ
      </a>
    </div>
  </div>
</nav>

<!-- แถบแจ้งเตือนสถานะคุณครู -->
<div class="container" id="teacherBadgeBar" style="display: none;">
  <div class="alert alert-success d-flex justify-content-between align-items-center rounded-4 shadow-sm py-2 mb-4 border-0 bg-success text-white">
    <span class="d-flex align-items-center gap-2">
      <i class="bi bi-check-circle-fill fs-5"></i>
      <div><strong>โหมดคุณครูทำงานอยู่:</strong> แสดงสื่อเอกสารและเฉลย Block Code เรียบร้อยแล้ว</div>
    </span>
    <button class="btn btn-sm btn-light text-danger rounded-pill fw-bold" onclick="logoutTeacher()">ออกจากโหมดคุณครู</button>
  </div>
</div>

<!-- Main Container -->
<div class="container mb-5">
  <div class="row g-4">
    <div class="col-lg-3">
      <div class="custom-card p-3 sticky-top" style="top: 90px; z-index: 10;">
        <h6 class="fw-bold mb-3 text-uppercase text-muted small tracking-wide px-2 font-heading d-flex align-items-center gap-2">
          <i class="bi bi-journal-bookmark text-primary"></i> สารบัญบทเรียน
        </h6>
        <div class="nav flex-column lesson-nav" id="lessonTabs" role="tablist"></div>
      </div>
    </div>

    <div class="col-lg-9">
      <div class="custom-card p-4 p-md-5" id="lessonContent">
        <div class="text-center my-5 py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="text-muted mt-3 fw-medium font-heading">กำลังโหลดเนื้อหาบทเรียน...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal ยืนยันตัวตนสำหรับโหมดคุณครู -->
<div class="modal fade" id="teacherModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: var(--card-radius);">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title fw-bold font-heading"><i class="bi bi-person-badge text-warning me-2"></i>เข้าสู่ระบบโหมดคุณครู</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4 text-center">
        <i class="bi bi-shield-lock text-primary display-4 mb-3 d-block"></i>
        <p class="text-muted small">กรอกรหัสผ่านผู้สอนเพื่อดูสื่อคู่มือและเฉลยกิจกรรม</p>
        <input type="password" class="form-control text-center fs-5 mb-3" id="teacherPassInput" placeholder="กรอกรหัสผ่าน">
        <div id="teacherAuthAlert"></div>
        <button class="btn btn-custom-primary w-100 py-2 font-heading" onclick="verifyTeacherPassword()">ยืนยันตัวตน</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwLmADH7xGBWxN3S2JJ-eW3ox2_P4yXjgGOryqfR1En48DN31HSKp_T8DFRVWvphJsU/exec";

  let lessonsData = [];
  let currentLessonId = null;
  let teacherModalObj = null;
  let isTeacherLoggedIn = false;

  window.onload = function() {
    teacherModalObj = new bootstrap.Modal(document.getElementById('teacherModal'));
    fetchInitialData();
  };

  function fetchInitialData() {
    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getInitialData" })
    })
    .then(res => res.json())
    .then(data => renderLessons(data))
    .catch(err => console.error("Error loading data:", err));
  }

  function renderLessons(data) {
    lessonsData = data;
    let tabs = '';
    data.forEach((l, idx) => {
      tabs += `
        <button class="nav-link ${idx===0?'active':''}" onclick="loadLesson(${l.id}, this)">
          <span>บทที่ ${l.id}</span>
          <i class="bi bi-chevron-right small opacity-50"></i>
        </button>`;
    });
    document.getElementById('lessonTabs').innerHTML = tabs;
    if (data.length > 0) loadLesson(data[0].id);
  }

  function loadLesson(id, btnElem) {
    currentLessonId = id;
    if(btnElem) {
      document.querySelectorAll('#lessonTabs .nav-link').forEach(b => b.classList.remove('active'));
      btnElem.classList.add('active');
    }

    let l = lessonsData.find(item => item.id === id);
    if (!l) return;

    // 🟢 1. เตรียม HTML วิดีโอการ์ตูนสถานการณ์ (ถ้ามี)
    let scenarioVidHtml = '';
    if ([2, 3, 4].includes(l.id) && l.scenarioVideo) {
      let embedScenario = getEmbedYoutubeUrl(l.scenarioVideo);
      if (embedScenario) {
        scenarioVidHtml = `
          <div class="card border-0 shadow-sm p-3 mb-4 rounded-4" style="background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%); border-left: 5px solid #f97316 !important;">
            <h5 class="fw-bold text-warning-emphasis font-heading mb-2">
              <i class="bi bi-film me-2 text-danger"></i> 🎬 การ์ตูนสถานการณ์จำลอง (บทที่ ${l.id})
            </h5>
            <p class="text-secondary small mb-3">ชวนคิดก่อนเริ่มเรียน: มาดูสถานการณ์จำลองของบทเรียนนี้กันก่อนเลย!</p>
            <div class="video-container shadow-sm mb-0">
              <iframe src="${embedScenario}" allowfullscreen></iframe>
            </div>
          </div>
        `;
      }
    }

    // 🟢 2. เตรียม HTML วิดีโอเนื้อหาประกอบการเรียนรู้หลัก
    let vids = l.videos ? l.videos.map(v => {
      let embedUrl = getEmbedYoutubeUrl(v);
      return embedUrl ? `<div class="video-container mb-3"><iframe src="${embedUrl}" allowfullscreen></iframe></div>` : '';
    }).join('') : '';

    let mainVidsHtml = `
      <div class="mb-4">
        <h5 class="fw-bold font-heading mb-3 d-flex align-items-center gap-2">
          <i class="bi bi-play-btn-fill text-danger"></i> วิดีโอเนื้อหาประกอบการเรียนรู้
        </h5>
        ${vids || '<div class="p-4 bg-light rounded-3 text-center text-muted border">ยังไม่มีคลิปวิดีโอสำหรับบทเรียนนี้</div>'}
      </div>
    `;

    // 🟢 3. จัดเรียงลำดับวิดีโอ (ตามที่เลือกใน Admin: before = ก่อน / after = หลัง)
    let combinedVideosHtml = '';
    let pos = l.scenarioPosition || 'before';
    if (pos === 'after') {
      combinedVideosHtml = mainVidsHtml + scenarioVidHtml;
    } else {
      combinedVideosHtml = scenarioVidHtml + mainVidsHtml;
    }

    // 🟢 4. เตรียมสื่อผู้สอน
    let teacherHtml = '';
    if (isTeacherLoggedIn) {
      teacherHtml = `
        <div class="teacher-section p-4 my-4">
          <div class="d-flex align-items-center gap-2 text-success mb-3 pb-2 border-bottom border-success-subtle">
            <i class="bi bi-person-badge-fill fs-4"></i>
            <h5 class="fw-bold mb-0 font-heading">สื่อและเอกสารสำหรับผู้สอน (โหมดคุณครู)</h5>
          </div>
          
          <div class="row g-3">
            <div class="col-md-4">
              <div class="teacher-card p-3 h-100 d-flex flex-column justify-content-between">
                <div>
                  <h6 class="fw-bold text-dark font-heading mb-1"><i class="bi bi-file-earmark-pdf-fill text-danger me-2"></i>คู่มือคำชี้แจงผู้สอน</h6>
                  <p class="text-muted small mb-3">แนวทางการสอนและแผนกิจกรรม</p>
                </div>
                ${l.teacherPdfUrl ? `<a href="${l.teacherPdfUrl}" target="_blank" class="btn btn-danger btn-sm rounded-pill font-heading w-100"><i class="bi bi-download me-1"></i> ดาวน์โหลด PDF</a>` : '<span class="badge bg-light text-muted w-100 py-2">ยังไม่มีไฟล์คู่มือ</span>'}
              </div>
            </div>

            <div class="col-md-4">
              <div class="teacher-card p-3 h-100 d-flex flex-column justify-content-between">
                <div>
                  <h6 class="fw-bold text-dark font-heading mb-1"><i class="bi bi-file-earmark-check-fill text-success me-2"></i>เฉลยใบกิจกรรม</h6>
                  <p class="text-muted small mb-3">คำตอบเฉลยประจำบทเรียน</p>
                </div>
                ${l.answerSheetUrl ? `<a href="${l.answerSheetUrl}" target="_blank" class="btn btn-success btn-sm rounded-pill font-heading w-100"><i class="bi bi-file-earmark-text me-1"></i> ดูเฉลยใบงาน</a>` : '<span class="badge bg-light text-muted w-100 py-2">ยังไม่มีไฟล์เฉลย</span>'}
              </div>
            </div>

            <div class="col-md-4">
              <div class="teacher-card p-3 h-100 d-flex flex-column justify-content-between">
                <div>
                  <h6 class="fw-bold text-dark font-heading mb-1"><i class="bi bi-code-slash text-primary me-2"></i> MakeCode Project</h6>
                  <p class="text-muted small mb-3">ลิงก์โปรเจกต์โค้ดเฉลยต้นแบบ</p>
                </div>
                ${l.solutionCodeUrl ? `<a href="${l.solutionCodeUrl}" target="_blank" class="btn btn-outline-primary btn-sm rounded-pill font-heading w-100"><i class="bi bi-box-arrow-up-right me-1"></i> เปิด MakeCode</a>` : '<span class="badge bg-light text-muted w-100 py-2">ยังไม่มีลิงก์</span>'}
              </div>
            </div>

            <div class="col-12 mt-3">
              <div class="teacher-card p-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <h6 class="fw-bold text-dark font-heading mb-0"><i class="bi bi-image text-info me-2"></i>รูปภาพเฉลย Block Code ที่ถูกต้อง</h6>
                  ${l.solutionImgUrl ? `<a href="${l.solutionImgUrl}" target="_blank" class="btn btn-sm btn-link text-decoration-none small"><i class="bi bi-arrows-angle-expand me-1"></i> ดูภาพขนาดเต็ม</a>` : ''}
                </div>
                
                <div class="solution-img-wrapper mt-2">
                  ${l.solutionImgUrl ? 
                    `<img src="${l.solutionImgUrl}" class="solution-img-preview" alt="รูปเฉลย Block Code">` : 
                    '<div class="py-5 text-muted small"><i class="bi bi-image fs-1 d-block mb-2 text-black-50"></i>ยังไม่ได้อัปโหลดรูปภาพ Block Code เฉลยสำหรับบทเรียนนี้</div>'
                  }
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    let html = `
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <div>
          <span class="badge badge-chapter mb-2 font-heading">บทเรียนที่ ${l.id}</span>
          <h2 class="fw-bold text-dark font-heading mb-0">${l.title}</h2>
        </div>
        ${l.worksheetUrl ? `<a href="${l.worksheetUrl}" target="_blank" class="btn btn-outline-success rounded-pill font-heading px-3 fw-medium"><i class="bi bi-file-earmark-arrow-down-fill me-1"></i> ดาวน์โหลดใบงานนักเรียน</a>` : ''}
      </div>
      <p class="text-secondary fs-6 mb-4 leading-relaxed">${l.desc || ''}</p>

      ${teacherHtml}
      ${combinedVideosHtml}

      <div class="bg-light p-4 rounded-4 border">
        <h5 class="fw-bold font-heading text-dark mb-1"><i class="bi bi-check-circle text-success me-1"></i> ตรวจสอบ Block Code อัตโนมัติ</h5>
        <p class="text-muted small mb-3">วาง Project Link จาก Microsoft MakeCode เพื่อตรวจทานความถูกต้องก่อนนำโค้ดลงหุ่นยนต์</p>
        
        <form onsubmit="handleInlineCheck(event, ${l.id})">
          <div class="input-group mb-3">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-link-45deg text-muted"></i></span>
            <input type="url" class="form-control border-start-0" id="inlineCheckUrl_${l.id}" placeholder="https://makecode.microbit.org/S00000-00000-00000-00000" required>
            <button type="submit" class="btn btn-custom-primary px-4" id="btnInlineCheck_${l.id}">
              ตรวจสอบโค้ด
            </button>
          </div>
        </form>
        <div id="inlineCheckResult_${l.id}"></div>
      </div>
    `;

    document.getElementById('lessonContent').innerHTML = html;
  }

  function getEmbedYoutubeUrl(url) {
    if (!url) return '';
    url = url.trim();
    let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    let match = url.match(regExp);
    return (match && match[2].length === 11) ? 'https://www.youtube.com/embed/' + match[2] : url;
  }

  function handleInlineCheck(event, chapterId) {
    event.preventDefault();
    let urlInput = document.getElementById(`inlineCheckUrl_${chapterId}`);
    let btn = document.getElementById(`btnInlineCheck_${chapterId}`);
    let resDiv = document.getElementById(`inlineCheckResult_${chapterId}`);

    btn.disabled = true;
    resDiv.innerHTML = `<div class="p-3 text-center text-muted bg-white rounded-3 border mt-2"><div class="spinner-border spinner-border-sm text-primary me-2"></div> กำลังวิเคราะห์ Block Code...</div>`;

    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "checkCode", chapterId: chapterId, shareUrl: urlInput.value })
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      if(!res.success) {
        resDiv.innerHTML = `<div class="alert alert-danger rounded-3 mb-0 mt-2">${res.message}</div>`;
      } else if(res.passed) {
        resDiv.innerHTML = `<div class="alert alert-success rounded-3 mb-0 mt-2"><h6 class="fw-bold font-heading mb-1"><i class="bi bi-patch-check-fill me-1"></i> ตรวจสอบผ่าน</h6><p class="mb-0 small">${res.message}</p></div>`;
      } else {
        let list = res.feedback.map(f => `<li>${f}</li>`).join('');
        resDiv.innerHTML = `<div class="alert alert-warning rounded-3 mb-0 mt-2"><h6 class="fw-bold font-heading mb-1"><i class="bi bi-exclamation-triangle-fill me-1"></i> จุดที่ต้องแก้ไขเพิ่มเติม:</h6><ul class="mb-0 ps-3 small">${list}</ul></div>`;
      }
    })
    .catch(err => {
      btn.disabled = false;
      resDiv.innerHTML = `<div class="alert alert-danger rounded-3 mb-0 mt-2">เกิดข้อผิดพลาดในการเชื่อมต่อ: ${err.message}</div>`;
    });
  }

  function openTeacherModal() {
    document.getElementById('teacherPassInput').value = '';
    document.getElementById('teacherAuthAlert').innerHTML = '';
    teacherModalObj.show();
  }

  function verifyTeacherPassword() {
    let pass = document.getElementById('teacherPassInput').value;
    if (pass === 'admin1234') {
      isTeacherLoggedIn = true;
      document.getElementById('teacherBadgeBar').style.display = 'block';
      document.getElementById('btnTeacherLogin').style.display = 'none';
      teacherModalObj.hide();
      loadLesson(currentLessonId);
    } else {
      document.getElementById('teacherAuthAlert').innerHTML = `<div class="alert alert-danger py-2 small rounded-3 mb-3">รหัสผ่านไม่ถูกต้อง!</div>`;
    }
  }

  function logoutTeacher() {
    isTeacherLoggedIn = false;
    document.getElementById('teacherBadgeBar').style.display = 'none';
    document.getElementById('btnTeacherLogin').style.display = 'inline-flex';
    loadLesson(currentLessonId);
  }
</script>
</body>
</html>
