<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สื่อการเรียนรู้หุ่นยนต์ ROBOCART</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Font: Prompt & Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #00bcd4;
      --bg-color: #e0e0e0;
      --card-radius: 14px;
      --checker-theme-color: #ff751f;
    }
    
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: var(--bg-color);
      color: #1e293b;
      margin: 0;
      padding: 0;
    }

    h1, h2, h3, h4, h5, h6, .font-heading {
      font-family: 'Prompt', sans-serif;
    }

    /* Top Navbar */
    .navbar {
      background-color: #00b4d8;
      padding: 12px 24px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .btn-wireframe-yellow {
      background-color: #ffb703;
      color: #000;
      border-radius: 50px;
      font-weight: 600;
      padding: 8px 24px;
      border: none;
    }

    .btn-wireframe-yellow:hover {
      background-color: #fb8500;
      color: #fff;
    }

    .btn-wireframe-gray {
      background-color: #adb5bd;
      color: #fff;
      border-radius: 50px;
      font-weight: 600;
      padding: 8px 24px;
      border: none;
    }

    .btn-wireframe-gray:hover {
      background-color: #6c757d;
      color: #fff;
    }

    /* Main Layout */
    .main-wrapper {
      width: 100%;
      max-width: 1750px;
      margin: 0 auto;
      padding: 16px;
    }

    .sidebar-card {
      background-color: #ffb703;
      border-radius: var(--card-radius);
      padding: 16px;
      min-height: 80vh;
    }

    .lesson-nav .nav-link {
      color: #333;
      font-weight: 600;
      font-family: 'Prompt', sans-serif;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
      transition: all 0.2s ease;
      background-color: rgba(255, 255, 255, 0.4);
      border: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lesson-nav .nav-link:hover {
      background-color: rgba(255, 255, 255, 0.8);
      color: #000;
    }

    .lesson-nav .nav-link.active {
      background-color: #ffffff;
      color: #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .content-card-large {
      background-color: #ffffff;
      border-radius: var(--card-radius);
      padding: 36px;
      min-height: 80vh;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    /* Video Frame */
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      background: #000;
    }
    
    .video-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }

    /* 🎬 กล่องที่ 1: การ์ตูนสถานการณ์จำลอง */
    .scenario-card-modern {
      background: linear-gradient(135deg, #fff3eb 0%, #ffe5d9 100%);
      border: 2px solid #ff9f1c;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(255, 159, 28, 0.2);
    }

    .scenario-badge {
      background: linear-gradient(135deg, #ff9f1c 0%, #ff4000 100%);
      color: #fff;
      font-family: 'Prompt', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      padding: 8px 22px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(255, 64, 0, 0.25);
    }

    .scenario-subtext {
      font-size: 1.1rem;
      font-weight: 600;
      color: #c2410c;
    }

    /* 🎬 กล่องที่ 2: วิดีโอทบทวนเนื้อหา */
    .review-card-modern {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 24px;
    }

    /* 🎬 กล่องที่ 3: การ์ตูนมอบหมายภารกิจ */
    .mission-card-modern {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 2px solid #3b82f6;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.2);
    }

    .mission-badge {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      font-family: 'Prompt', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      padding: 8px 22px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }

    .mission-subtext {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1e40af;
    }

    /* 🔥 กล่องตรวจสอบ Block Code (โทนส้ม #ff751f) */
    .checker-hero-card {
      background: linear-gradient(135deg, #ff751f 0%, #e65c00 100%);
      border: 2px solid #ff9d5c;
      border-radius: 20px;
      padding: 28px;
      color: #ffffff;
      box-shadow: 0 12px 30px -5px rgba(255, 117, 31, 0.4);
      position: relative;
      overflow: hidden;
    }

    .checker-hero-card::before {
      content: "";
      position: absolute;
      top: -50px;
      right: -50px;
      width: 150px;
      height: 150px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      blur: 40px;
    }

    .badge-check {
      background-color: #ffffff;
      color: var(--checker-theme-color);
      font-family: 'Prompt', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 30px;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .btn-checker-submit {
      background-color: #1e293b;
      color: #ffffff;
      font-family: 'Prompt', sans-serif;
      font-weight: 600;
      border-radius: 12px;
      padding: 12px 28px;
      border: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: all 0.2s ease;
    }

    .btn-checker-submit:hover {
      background-color: #0f172a;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    .teacher-section {
      background: #f0fdf4;
      border: 2px dashed #10b981;
      border-radius: var(--card-radius);
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container-fluid px-3">
    <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2 text-white" href="#">
      <i class="bi bi-robot fs-3 text-warning"></i> 
      <span>ROBOCART <small class="fs-6 fw-normal opacity-75">Learning Center</small></span>
    </a>
    
    <div class="d-flex gap-2 ms-auto">
      <button class="btn btn-wireframe-yellow d-flex align-items-center gap-1" id="btnTeacherLogin" onclick="openTeacherModal()">
        <i class="bi bi-person-badge-fill"></i> โหมดคุณครู
      </button>

      <a href="admin.html" class="btn btn-wireframe-gray d-flex align-items-center gap-1 text-decoration-none">
        <i class="bi bi-gear-fill"></i> จัดการระบบ
      </a>
    </div>
  </div>
</nav>

<!-- แถบแจ้งเตือนโหมดคุณครู -->
<div class="container-fluid px-4 mt-3" id="teacherBadgeBar" style="display: none;">
  <div class="alert alert-success d-flex justify-content-between align-items-center rounded-4 shadow-sm py-2 mb-0 border-0 bg-success text-white">
    <span class="d-flex align-items-center gap-2">
      <i class="bi bi-check-circle-fill fs-5"></i>
      <div><strong>โหมดคุณครูทำงานอยู่:</strong> แสดงสื่อเอกสารและเฉลย Block Code เรียบร้อยแล้ว</div>
    </span>
    <button class="btn btn-sm btn-light text-danger rounded-pill fw-bold" onclick="logoutTeacher()">ออกจากโหมดคุณครู</button>
  </div>
</div>

<!-- Main Wrapper -->
<div class="main-wrapper">
  <div class="row g-3">
    <!-- ฝั่งซ้าย: สารบัญ -->
    <div class="col-lg-2 col-md-3">
      <div class="sidebar-card">
        <h6 class="fw-bold mb-3 text-dark font-heading d-flex align-items-center gap-2">
          <i class="bi bi-journal-bookmark"></i> สารบัญ
        </h6>
        <div class="nav flex-column lesson-nav" id="lessonTabs" role="tablist"></div>
      </div>
    </div>

    <!-- ฝั่งขวา: เนื้อหาหลัก -->
    <div class="col-lg-10 col-md-9">
      <div class="content-card-large" id="lessonContent">
        <div class="text-center my-5 py-5">
          <div class="spinner-border text-info" role="status"></div>
          <p class="text-muted mt-3 fw-medium font-heading">กำลังโหลดเนื้อหาบทเรียน...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal ยืนยันตัวตนโหมดคุณครู -->
<div class="modal fade" id="teacherModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: var(--card-radius);">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title fw-bold font-heading"><i class="bi bi-person-badge text-warning me-2"></i>เข้าสู่ระบบโหมดคุณครู</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4 text-center">
        <i class="bi bi-shield-lock text-primary display-4 mb-3 d-block"></i>
        <p class="text-muted small">กรอกรหัสผ่านผู้สอนเพื่อดูสื่อคู่มือและเฉลยกิจกรรม</p>
        <input type="password" class="form-control text-center fs-5 mb-3" id="teacherPassInput" placeholder="กรอกรหัสผ่าน">
        <div id="teacherAuthAlert"></div>
        <button class="btn btn-primary w-100 py-2 font-heading" onclick="verifyTeacherPassword()">ยืนยันตัวตน</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyr-_F4t-CjI0RlxDnzDs8bWaX60dkx8m1L7OVODonKcRw8F6FVSCf_mNvPmfcsVFwb/exec";
  let lessonsData = [];
  let currentLessonId = null;
  let teacherModalObj = null;
  let isTeacherLoggedIn = false;

  window.onload = function() {
    teacherModalObj = new bootstrap.Modal(document.getElementById('teacherModal'));
    fetchInitialData();
  };

  function fetchInitialData() {
    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getInitialData" })
    })
    .then(res => res.json())
    .then(data => renderLessons(data))
    .catch(err => console.error("Error loading data:", err));
  }

  function renderLessons(data) {
    lessonsData = data;
    let tabs = '';
    data.forEach((l, idx) => {
      tabs += `
        <button class="nav-link ${idx===0?'active':''}" onclick="loadLesson(${l.id}, this)">
          <span>บทที่ ${l.id}</span>
          <i class="bi bi-chevron-right small opacity-50"></i>
        </button>`;
    });
    document.getElementById('lessonTabs').innerHTML = tabs;
    if (data.length > 0) loadLesson(data[0].id);
  }

  function loadLesson(id, btnElem) {
    currentLessonId = id;
    if(btnElem) {
      document.querySelectorAll('#lessonTabs .nav-link').forEach(b => b.classList.remove('active'));
      btnElem.classList.add('active');
    }

    let l = lessonsData.find(item => item.id === id);
    if (!l) return;

    // 🟢 ส่วนที่ 1: การ์ตูนสถานการณ์จำลอง (Simulation Scenario)
    let scenarioVidHtml = '';
    if (l.scenarioVideo) {
      let embedScenario = getEmbedYoutubeUrl(l.scenarioVideo);
      if (embedScenario) {
        scenarioVidHtml = `
          <div class="scenario-card-modern mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
              <span class="scenario-badge">
                <i class="bi bi-film"></i> การ์ตูนสถานการณ์จำลอง (บทที่ ${l.id})
              </span>
              <span class="scenario-subtext">
                <i class="bi bi-lightbulb-fill me-1"></i>ชวนคิดก่อนเริ่มลงมือปฏิบัติ!
              </span>
            </div>
            <div class="video-container shadow">
              <iframe src="${embedScenario}" allowfullscreen></iframe>
            </div>
          </div>
        `;
      }
    }

    // 🟢 ส่วนที่ 2: วิดีโอทบทวนเนื้อหาประกอบการเรียนรู้ (Lesson Review)
    let reviewVidsHtml = '';
    let reviewEmbeds = l.videos ? l.videos.map(v => {
      let embedUrl = getEmbedYoutubeUrl(v);
      return embedUrl ? `<div class="video-container mb-3"><iframe src="${embedUrl}" allowfullscreen></iframe></div>` : '';
    }).join('') : '';

    reviewVidsHtml = `
      <div class="review-card-modern mb-4">
        <h5 class="fw-bold font-heading mb-3 d-flex align-items-center gap-2 text-dark">
          <i class="bi bi-play-btn-fill text-danger fs-4"></i> วิดีโอทบทวนเนื้อหาประกอบการเรียนรู้
        </h5>
        ${reviewEmbeds || '<div class="p-3 bg-white rounded-3 text-center text-muted border">ยังไม่มีคลิปวิดีโอทบทวนเนื้อหาสำหรับบทเรียนนี้</div>'}
      </div>
    `;

    // 🟢 ส่วนที่ 3: การ์ตูนมอบหมายภารกิจ (Mission Assignment)
    let missionVidHtml = '';
    let missionUrl = l.missionVideo || (l.videos && l.videos[1] ? l.videos[1] : '');
    if (missionUrl) {
      let embedMission = getEmbedYoutubeUrl(missionUrl);
      if (embedMission) {
        missionVidHtml = `
          <div class="mission-card-modern mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
              <span class="mission-badge">
                <i class="bi bi-flag-fill"></i> การ์ตูนมอบหมายภารกิจ (บทที่ ${l.id})
              </span>
              <span class="mission-subtext">
                <i class="bi bi-trophy-fill me-1"></i>พร้อมลุยภารกิจท้าทายประจำบทเรียน!
              </span>
            </div>
            <div class="video-container shadow">
              <iframe src="${embedMission}" allowfullscreen></iframe>
            </div>
          </div>
        `;
      }
    }

    // 🟢 โหมดคุณครู
    let teacherHtml = '';
    if (isTeacherLoggedIn) {
      teacherHtml = `
        <div class="teacher-section p-4 my-4">
          <div class="d-flex align-items-center gap-2 text-success mb-3 pb-2 border-bottom border-success-subtle">
            <i class="bi bi-person-badge-fill fs-4"></i>
            <h5 class="fw-bold mb-0 font-heading">สื่อและเอกสารสำหรับผู้สอน (โหมดคุณครู)</h5>
          </div>
          
          <div class="row g-3">
            <div class="col-md-4">
              <div class="p-3 bg-white rounded-3 border h-100 d-flex flex-column justify-content-between">
                <div>
                  <h6 class="fw-bold text-dark font-heading mb-1"><i class="bi bi-file-earmark-pdf-fill text-danger me-2"></i>คู่มือคำชี้แจงผู้สอน</h6>
                  <p class="text-muted small mb-3">แนวทางการสอนและแผนกิจกรรม</p>
                </div>
                ${l.teacherPdfUrl ? `<a href="${l.teacherPdfUrl}" target="_blank" class="btn btn-danger btn-sm rounded-pill font-heading w-100"><i class="bi bi-download me-1"></i> ดาวน์โหลด PDF</a>` : '<span class="badge bg-light text-muted w-100 py-2">ยังไม่มีไฟล์คู่มือ</span>'}
              </div>
            </div>

            <div class="col-md-4">
              <div class="p-3 bg-white rounded-3 border h-100 d-flex flex-column justify-content-between">
                <div>
                  <h6 class="fw-bold text-dark font-heading mb-1"><i class="bi bi-file-earmark-check-fill text-success me-2"></i>เฉลยใบกิจกรรม</h6>
                  <p class="text-muted small mb-3">คำตอบเฉลยประจำบทเรียน</p>
                </div>
                ${l.answerSheetUrl ? `<a href="${l.answerSheetUrl}" target="_blank" class="btn btn-success btn-sm rounded-pill font-heading w-100"><i class="bi bi-file-earmark-text me-1"></i> ดูเฉลยใบงาน</a>` : '<span class="badge bg-light text-muted w-100 py-2">ยังไม่มีไฟล์เฉลย</span>'}
              </div>
            </div>

            <div class="col-md-4">
              <div class="p-3 bg-white rounded-3 border h-100 d-flex flex-column justify-content-between">
                <div>
                  <h6 class="fw-bold text-dark font-heading mb-1"><i class="bi bi-code-slash text-primary me-2"></i> MakeCode Project</h6>
                  <p class="text-muted small mb-3">ลิงก์โปรเจกต์โค้ดเฉลยต้นแบบ</p>
                </div>
                ${l.solutionCodeUrl ? `<a href="${l.solutionCodeUrl}" target="_blank" class="btn btn-outline-primary btn-sm rounded-pill font-heading w-100"><i class="bi bi-box-arrow-up-right me-1"></i> เปิด MakeCode</a>` : '<span class="badge bg-light text-muted w-100 py-2">ยังไม่มีลิงก์</span>'}
              </div>
            </div>

            <div class="col-12 mt-3">
              <div class="p-3 bg-white rounded-3 border">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <h6 class="fw-bold text-dark font-heading mb-0"><i class="bi bi-image text-info me-2"></i>รูปภาพเฉลย Block Code ที่ถูกต้อง</h6>
                  ${l.solutionImgUrl ? `<a href="${l.solutionImgUrl}" target="_blank" class="btn btn-sm btn-link text-decoration-none small"><i class="bi bi-arrows-angle-expand me-1"></i> ดูภาพขนาดเต็ม</a>` : ''}
                </div>
                
                <div class="text-center p-2 bg-light rounded-3 border mt-2">
                  ${l.solutionImgUrl ? 
                    `<img src="${l.solutionImgUrl}" style="max-height: 480px; width: 100%; object-fit: contain;" alt="รูปเฉลย Block Code" onerror="this.onerror=null; this.src='https://placehold.co/800x400?text=Solution+Image+Not+Found';">` : 
                    '<div class="py-4 text-muted small"><i class="bi bi-image fs-1 d-block mb-2 text-black-50"></i>ยังไม่ได้อัปโหลดรูปภาพ Block Code เฉลยสำหรับบทเรียนนี้</div>'
                  }
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    let html = `
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <div>
          <span class="badge bg-primary-subtle text-primary mb-2 font-heading px-3 py-1 rounded-pill">บทเรียนที่ ${l.id}</span>
          <h2 class="fw-bold text-dark font-heading mb-0 fs-2">${l.title}</h2>
        </div>
        ${l.worksheetUrl ? `<a href="${l.worksheetUrl}" target="_blank" class="btn btn-success rounded-pill font-heading px-4 py-2 fw-medium shadow-sm"><i class="bi bi-file-earmark-arrow-down-fill me-1"></i> ดาวน์โหลดใบงานนักเรียน</a>` : ''}
      </div>
      <p class="text-secondary fs-5 mb-4 leading-relaxed">${l.desc || ''}</p>

      ${teacherHtml}
      
      <!-- คลิปส่วนที่ 1: การ์ตูนสถานการณ์จำลอง -->
      ${scenarioVidHtml}

      <!-- คลิปส่วนที่ 2: วิดีโอทบทวนเนื้อหาประกอบการเรียนรู้ -->
      ${reviewVidsHtml}

      <!-- คลิปส่วนที่ 3: การ์ตูนมอบหมายภารกิจ -->
      ${missionVidHtml}

      <!-- กล่องตรวจ Block Code อัตโนมัติ (Hero Color #ff751f) -->
      <div class="checker-hero-card mt-5">
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="badge-check">
            <i class="bi bi-check-circle-fill me-1"></i> Check
          </span>
          <h4 class="fw-bold font-heading mb-0 text-white">ระบบตรวจสอบ Block Code อัตโนมัติ</h4>
        </div>
        <p class="text-white opacity-90 fs-6 mb-4">
          คัดลอก Share Link จาก Microsoft MakeCode มาวางในช่องด้านล่าง เพื่อตรวจทานความถูกต้องของโค้ดก่อนทำการแฟลชลงหุ่นยนต์ ROBOCART
        </p>
        
        <form onsubmit="handleInlineCheck(event, ${l.id})">
          <div class="row g-2">
            <div class="col-md-9">
              <div class="input-group shadow-sm">
                <span class="input-group-text bg-white border-0 text-dark fs-5 px-3"><i class="bi bi-link-45deg"></i></span>
                <input type="url" class="form-control border-0 py-3 fs-6" id="inlineCheckUrl_${l.id}" placeholder="วางลิงก์ MakeCode ที่นี่ (เช่น https://makecode.microbit.org/S00000-...)" required>
              </div>
            </div>
            <div class="col-md-3">
              <button type="submit" class="btn btn-checker-submit w-100 h-100 d-flex align-items-center justify-content-center gap-2 fs-6" id="btnInlineCheck_${l.id}">
                <i class="bi bi-cpu-fill fs-5"></i> ตรวจสอบโค้ด
              </button>
            </div>
          </div>
        </form>
        <div id="inlineCheckResult_${l.id}"></div>
      </div>
    `;

    document.getElementById('lessonContent').innerHTML = html;
  }

  function getEmbedYoutubeUrl(url) {
    if (!url) return '';
    url = url.trim();
    let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    let match = url.match(regExp);
    return (match && match[2].length === 11) ? 'https://www.youtube.com/embed/' + match[2] : url;
  }

  function handleInlineCheck(event, chapterId) {
    event.preventDefault();
    let urlInput = document.getElementById(`inlineCheckUrl_${chapterId}`);
    let btn = document.getElementById(`btnInlineCheck_${chapterId}`);
    let resDiv = document.getElementById(`inlineCheckResult_${chapterId}`);

    btn.disabled = true;
    resDiv.innerHTML = `<div class="p-3 text-center text-white bg-dark rounded-3 border border-secondary mt-3"><div class="spinner-border spinner-border-sm text-warning me-2"></div> กำลังวิเคราะห์ Block Code อัตโนมัติ...</div>`;

    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "checkCode", chapterId: chapterId, shareUrl: urlInput.value })
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      if(!res.success) {
        resDiv.innerHTML = `<div class="alert alert-danger rounded-3 mb-0 mt-3 border-0 shadow-sm"><i class="bi bi-exclamation-octagon-fill me-2"></i>${res.message}</div>`;
      } else if(res.passed) {
        resDiv.innerHTML = `<div class="alert alert-success rounded-3 mb-0 mt-3 border-0 shadow-sm"><h6 class="fw-bold font-heading mb-1"><i class="bi bi-patch-check-fill me-1"></i> ตรวจสอบผ่านเรียบร้อย!</h6><p class="mb-0 small">${res.message}</p></div>`;
      } else {
        let list = res.feedback.map(f => `<li>${f}</li>`).join('');
        resDiv.innerHTML = `<div class="alert alert-warning rounded-3 mb-0 mt-3 border-0 shadow-sm"><h6 class="fw-bold font-heading mb-1 text-dark"><i class="bi bi-exclamation-triangle-fill me-1"></i> จุดที่ต้องแก้ไขเพิ่มเติม:</h6><ul class="mb-0 ps-3 small text-dark">${list}</ul></div>`;
      }
    })
    .catch(err => {
      btn.disabled = false;
      resDiv.innerHTML = `<div class="alert alert-danger rounded-3 mb-0 mt-3 border-0 shadow-sm">เกิดข้อผิดพลาดในการเชื่อมต่อ: ${err.message}</div>`;
    });
  }

  function openTeacherModal() {
    document.getElementById('teacherPassInput').value = '';
    document.getElementById('teacherAuthAlert').innerHTML = '';
    teacherModalObj.show();
  }

  function verifyTeacherPassword() {
    let pass = document.getElementById('teacherPassInput').value;
    if (pass === 'admin1234') {
      isTeacherLoggedIn = true;
      document.getElementById('teacherBadgeBar').style.display = 'block';
      document.getElementById('btnTeacherLogin').style.display = 'none';
      teacherModalObj.hide();
      loadLesson(currentLessonId);
    } else {
      document.getElementById('teacherAuthAlert').innerHTML = `<div class="alert alert-danger py-2 small rounded-3 mb-3">รหัสผ่านไม่ถูกต้อง!</div>`;
    }
  }

  function logoutTeacher() {
    isTeacherLoggedIn = false;
    document.getElementById('teacherBadgeBar').style.display = 'none';
    document.getElementById('btnTeacherLogin').style.display = 'inline-flex';
    loadLesson(currentLessonId);
  }
</script>
</body>
</html>
