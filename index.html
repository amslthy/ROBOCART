<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สื่อการเรียนรู้หุ่นยนต์ ROBOCART</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Font: Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }
    
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: var(--bg-color);
      color: #334155;
    }

    .navbar {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    }

    .custom-card {
      border: none;
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      background: #ffffff;
    }

    .lesson-nav .nav-link {
      color: #64748b;
      font-weight: 500;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 6px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .lesson-nav .nav-link:hover {
      background-color: #f1f5f9;
      color: var(--primary-color);
    }

    .lesson-nav .nav-link.active {
      background-color: var(--primary-color);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      background: #000;
      margin-bottom: 20px;
    }
    
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .form-control, .form-select {
      border-radius: 10px;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
    }

    .btn-custom-primary {
      background-color: var(--primary-color);
      color: white;
      border-radius: 10px;
      font-weight: 600;
    }

    .teacher-section {
      background-color: #f0fdf4;
      border: 2px dashed #22c55e;
      border-radius: 16px;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark mb-4 py-3 shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="#">
      <i class="bi bi-robot text-warning fs-3"></i> ROBOCART Learning Center
    </a>
    
    <div class="d-flex gap-2">
      <!-- ปุ่มเข้าสู่ระบบสำหรับคุณครู -->
      <button class="btn btn-warning rounded-pill px-3 shadow-sm fw-bold text-dark" id="btnTeacherLogin" onclick="openAdminModal('teacher')">
        <i class="bi bi-person-badge-fill me-1"></i> โหมดคุณครู
      </button>

      <!-- ปุ่ม Admin -->
      <button class="btn btn-outline-light rounded-pill px-3 shadow-sm" onclick="openAdminModal('admin')">
        <i class="bi bi-shield-lock-fill me-1"></i> จัดการระบบ
      </button>
    </div>
  </div>
</nav>

<!-- แถบแจ้งเตือนสถานะคุณครู -->
<div class="container" id="teacherBadgeBar" style="display: none;">
  <div class="alert alert-success d-flex justify-content-between align-items-center rounded-4 shadow-sm py-2">
    <span><i class="bi bi-check-circle-fill me-2"></i><strong>คุณกำลังอยู่ในโหมดคุณครู:</strong> แสดงข้อมูลเฉลยและเอกสารคำชี้แจงผู้สอนแล้ว</span>
    <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="logoutTeacher()">ออกจากโหมดคุณครู</button>
  </div>
</div>

<!-- Main Container -->
<div class="container mb-5">
  <div class="row g-4">
    <!-- เมนูบทเรียน Side Menu -->
    <div class="col-lg-3">
      <div class="custom-card p-3">
        <h6 class="fw-bold mb-3 text-uppercase text-muted small tracking-wide px-2">
          <i class="bi bi-journal-bookmark me-1"></i> สารบัญบทเรียน
        </h6>
        <div class="nav flex-column lesson-nav" id="lessonTabs" role="tablist"></div>
      </div>
    </div>

    <!-- แสดงเนื้อหาบทเรียน Content Area -->
    <div class="col-lg-9">
      <div class="custom-card p-4 p-md-5" id="lessonContent">
        <div class="text-center my-5 py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="text-muted mt-3 fw-medium">กำลังโหลดเนื้อหาบทเรียน...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal ยืนยันตัวตน / Admin Editor -->
<div class="modal fade" id="adminModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title fw-bold" id="modalTitle">
          <i class="bi bi-shield-lock-fill me-2 text-warning"></i>ยืนยันตัวตนเข้าใช้งาน
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      
      <div class="modal-body p-4">
        <!-- หน้า Login -->
        <div id="adminAuthSection">
          <div class="text-center py-4">
            <i class="bi bi-person-check text-primary display-4"></i>
            <h5 class="fw-bold mt-3" id="loginHeaderTitle">กรุณายืนยันตัวตน</h5>
            <p class="text-muted small">กรอกรหัสผ่านเพื่อเข้าถึงข้อมูลสำหรับคุณครู/ผู้ดูแลระบบ</p>
          </div>
          <div class="row justify-content-center">
            <div class="col-md-8 mx-auto">
              <div class="mb-3">
                <input type="password" class="form-control text-center" id="adminPassInput" placeholder="กรอกรหัสผ่าน (ค่าเริ่มต้น: admin1234)">
              </div>
              <div id="authAlert"></div>
              <button class="btn btn-custom-primary w-100 py-2" onclick="verifyAdminPassword()">
                เข้าสู่ระบบ
              </button>
            </div>
          </div>
        </div>

        <!-- ฟอร์มแก้ไขเนื้อหา Admin Content Editor -->
        <div id="adminEditorSection" style="display: none;">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="badge bg-success-subtle text-success border border-success px-3 py-2 rounded-pill">
              <i class="bi bi-check-circle-fill me-1"></i> เข้าสู่ระบบจัดการเนื้อหา
            </span>
            <button class="btn btn-sm btn-outline-danger" onclick="logoutAdmin()">ออกจากระบบ</button>
          </div>
          <div id="adminFormArea"></div>
        </div>
      </div>

      <div class="modal-footer bg-light" id="adminModalFooter" style="display: none;">
        <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">ยกเลิก</button>
        <button type="button" class="btn btn-success rounded-pill px-4" onclick="saveAdminData()">
          <i class="bi bi-save me-1"></i> บันทึกการแก้ไข
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx_xYO1ZwGvGDtWjpfUKUBx5nlAuKf_r7ZnWhSlZPbcICzoInQf1pZm8UAgJduRoO9B/exec";

  let lessonsData = [];
  let currentLessonId = null;
  let adminModalObj = null;
  let isTeacherLoggedIn = false;
  let currentLoginTarget = 'teacher';

  window.onload = function() {
    adminModalObj = new bootstrap.Modal(document.getElementById('adminModal'));
    fetchInitialData();
  };

  function fetchInitialData() {
    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getInitialData" })
    })
    .then(res => res.json())
    .then(data => renderLessons(data))
    .catch(err => console.error("Error loading data:", err));
  }

  function renderLessons(data) {
    lessonsData = data;
    let tabs = '';
    data.forEach((l, idx) => {
      tabs += `
        <button class="nav-link ${idx===0?'active':''}" onclick="loadLesson(${l.id}, this)">
          <i class="bi bi-journal-text me-2"></i> ${l.title}
        </button>`;
    });
    document.getElementById('lessonTabs').innerHTML = tabs;
    if (data.length > 0) loadLesson(data[0].id);
  }

  function loadLesson(id, btnElem) {
    currentLessonId = id;
    if(btnElem) {
      document.querySelectorAll('#lessonTabs .nav-link').forEach(b => b.classList.remove('active'));
      btnElem.classList.add('active');
    }

    let l = lessonsData.find(item => item.id === id);
    if (!l) return;

    let vids = l.videos ? l.videos.map(v => {
      let embedUrl = getEmbedYoutubeUrl(v);
      return embedUrl ? `<div class="video-container"><iframe src="${embedUrl}" allowfullscreen></iframe></div>` : '';
    }).join('') : '';

    let teacherHtml = '';
    if (isTeacherLoggedIn) {
      teacherHtml = `
        <div class="teacher-section p-4 my-4">
          <h5 class="fw-bold text-success mb-3">
            <i class="bi bi-person-badge-fill me-2"></i>สื่อและเอกสารสำหรับผู้สอน (โหมดคุณครู)
          </h5>
          <div class="row g-3">
            <div class="col-md-6">
              <div class="card h-100 border-0 shadow-sm p-3">
                <h6 class="fw-bold text-dark mb-2"><i class="bi bi-file-earmark-pdf-fill text-danger me-2"></i>คำชี้แจงและแนวทางการสอน (PDF)</h6>
                <p class="text-muted small mb-3">คู่มือการสอน กำหนดการ และวัตถุประสงค์เชิงพฤติกรรม</p>
                ${l.teacherPdfUrl ? `<a href="${l.teacherPdfUrl}" target="_blank" class="btn btn-danger btn-sm rounded-pill fw-bold"><i class="bi bi-download me-1"></i> ดาวน์โหลดคู่มือผู้สอน</a>` : '<span class="text-muted small">ยังไม่มีไฟล์คู่มือ</span>'}
              </div>
            </div>

            <div class="col-md-6">
              <div class="card h-100 border-0 shadow-sm p-3">
                <h6 class="fw-bold text-dark mb-2"><i class="bi bi-file-earmark-check-fill text-success me-2"></i>เฉลยใบงาน / ใบกิจกรรม</h6>
                <p class="text-muted small mb-3">เอกสารเฉลยคำตอบของกิจกรรมประจำบทเรียน</p>
                ${l.answerSheetUrl ? `<a href="${l.answerSheetUrl}" target="_blank" class="btn btn-success btn-sm rounded-pill fw-bold"><i class="bi bi-file-earmark-text me-1"></i> ดูเฉลยใบงาน</a>` : '<span class="text-muted small">ยังไม่มีไฟล์เฉลย</span>'}
              </div>
            </div>

            <div class="col-12 mt-3">
              <div class="card border-0 shadow-sm p-3 bg-white">
                <h6 class="fw-bold text-dark mb-2"><i class="bi bi-code-slash text-primary me-2"></i>เฉลย Block Code ที่ถูกต้อง</h6>
                <div class="mb-2">
                  <strong>ลิงก์โปรเจกต์เฉลย (MakeCode):</strong> 
                  ${l.solutionCodeUrl ? `<a href="${l.solutionCodeUrl}" target="_blank" class="ms-1 fw-bold text-primary">${l.solutionCodeUrl}</a>` : '<span class="text-muted ms-1">ยังไม่มีลิงก์เฉลย</span>'}
                </div>
                <div>
                  <strong>รูปภาพบล็อกคำสั่งที่ถูกต้อง:</strong><br>
                  ${l.solutionImgUrl ? `<img src="${l.solutionImgUrl}" class="img-fluid rounded border mt-2" style="max-height: 400px;">` : '<p class="text-muted small mt-1">ยังไม่มีรูปภาพเฉลย</p>'}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    let html = `
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold text-primary mb-0">${l.title}</h3>
        ${l.worksheetUrl ? `<a href="${l.worksheetUrl}" target="_blank" class="btn btn-outline-success btn-sm rounded-pill fw-bold"><i class="bi bi-file-earmark-arrow-down-fill me-1"></i> ดาวน์โหลดใบงานนักเรียน</a>` : ''}
      </div>
      <p class="text-secondary fs-6 mb-4">${l.desc || ''}</p>

      ${teacherHtml}

      <h5 class="fw-bold mb-3"><i class="bi bi-play-btn-fill text-danger me-1"></i> วิดีโอประกอบการเรียน</h5>
      ${vids || '<div class="alert alert-light text-muted border">ยังไม่มีคลิปวิดีโอสำหรับบทเรียนนี้</div>'}

      <hr class="my-4">
      <div class="bg-light p-4 rounded-4 border">
        <h5 class="fw-bold text-dark mb-2"><i class="bi bi-search text-success me-1"></i> ตรวจสอบ Block Code ของคุณ (${l.title})</h5>
        <p class="text-muted small mb-3">วาง Project Link ที่แชร์จาก Microsoft MakeCode เพื่อตรวจคำสั่งก่อนนำโค้ดไปลงหุ่นยนต์จริง</p>
        
        <form onsubmit="handleInlineCheck(event, ${l.id})">
          <div class="input-group mb-3">
            <span class="input-group-text bg-white"><i class="bi bi-link-45deg"></i></span>
            <input type="url" class="form-control" id="inlineCheckUrl_${l.id}" placeholder="https://makecode.microbit.org/S00000-00000-00000-00000" required>
            <button type="submit" class="btn btn-custom-primary px-4" id="btnInlineCheck_${l.id}">
              ตรวจสอบโค้ด
            </button>
          </div>
        </form>
        <div id="inlineCheckResult_${l.id}"></div>
      </div>
    `;

    document.getElementById('lessonContent').innerHTML = html;
  }

  function getEmbedYoutubeUrl(url) {
    if (!url) return '';
    url = url.trim();
    let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    let match = url.match(regExp);
    return (match && match[2].length === 11) ? 'https://www.youtube.com/embed/' + match[2] : url;
  }

  function handleInlineCheck(event, chapterId) {
    event.preventDefault();
    let urlInput = document.getElementById(`inlineCheckUrl_${chapterId}`);
    let btn = document.getElementById(`btnInlineCheck_${chapterId}`);
    let resDiv = document.getElementById(`inlineCheckResult_${chapterId}`);

    btn.disabled = true;
    resDiv.innerHTML = `<div class="p-3 text-center text-muted bg-white rounded border mt-2"><div class="spinner-border spinner-border-sm text-primary me-2"></div> กำลังวิเคราะห์ Block Code...</div>`;

    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "checkCode", chapterId: chapterId, shareUrl: urlInput.value })
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      if(!res.success) {
        resDiv.innerHTML = `<div class="alert alert-danger mb-0 mt-2">${res.message}</div>`;
      } else if(res.passed) {
        resDiv.innerHTML = `<div class="alert alert-success mb-0 mt-2"><h5><i class="bi bi-patch-check-fill me-1"></i> ตรวจสอบผ่าน</h5><p class="mb-0 fw-bold">${res.message}</p></div>`;
      } else {
        let list = res.feedback.map(f => `<li>${f}</li>`).join('');
        resDiv.innerHTML = `<div class="alert alert-warning mb-0 mt-2"><h5><i class="bi bi-exclamation-triangle-fill me-1"></i> จุดที่ต้องแก้ไขเพิ่มเติม:</h5><ul class="mb-0 ps-3">${list}</ul></div>`;
      }
    })
    .catch(err => {
      btn.disabled = false;
      resDiv.innerHTML = `<div class="alert alert-danger mb-0 mt-2">เกิดข้อผิดพลาดในการเชื่อมต่อ: ${err.message}</div>`;
    });
  }

  function openAdminModal(target) {
    currentLoginTarget = target;
    logoutAdmin();
    document.getElementById('loginHeaderTitle').innerText = target === 'teacher' ? 'เข้าสู่ระบบโหมดคุณครู' : 'เข้าสู่ระบบจัดการเนื้อหา (Admin)';
    adminModalObj.show();
  }

  function verifyAdminPassword() {
    let pass = document.getElementById('adminPassInput').value;
    let alertDiv = document.getElementById('authAlert');

    if (pass === 'admin1234') {
      alertDiv.innerHTML = '';
      if (currentLoginTarget === 'teacher') {
        isTeacherLoggedIn = true;
        document.getElementById('teacherBadgeBar').style.display = 'block';
        document.getElementById('btnTeacherLogin').style.display = 'none';
        adminModalObj.hide();
        loadLesson(currentLessonId);
      } else {
        showAdminEditor();
      }
    } else {
      alertDiv.innerHTML = `<div class="alert alert-danger py-2 small">รหัสผ่านไม่ถูกต้อง!</div>`;
    }
  }

  function logoutTeacher() {
    isTeacherLoggedIn = false;
    document.getElementById('teacherBadgeBar').style.display = 'none';
    document.getElementById('btnTeacherLogin').style.display = 'inline-block';
    loadLesson(currentLessonId);
  }

  function showAdminEditor() {
    document.getElementById('adminAuthSection').style.display = 'none';
    document.getElementById('adminEditorSection').style.display = 'block';
    document.getElementById('adminModalFooter').style.display = 'flex';

    let html = '';
    lessonsData.forEach((l, i) => {
      html += `
        <div class="card p-3 mb-3 bg-light border-0 shadow-sm rounded-3">
          <h6 class="fw-bold text-primary mb-3"><i class="bi bi-journal-text me-1"></i> บทเรียนที่ ${i+1}: ${l.title}</h6>
          <div class="mb-2">
            <label class="form-label small fw-bold mb-1">ชื่อบทเรียน</label>
            <input type="text" class="form-control form-control-sm" id="title_${i}" value="${l.title || ''}">
          </div>
          <div class="mb-2">
            <label class="form-label small fw-bold mb-1">รายละเอียดบทเรียน</label>
            <textarea class="form-control form-control-sm" id="desc_${i}" rows="2">${l.desc || ''}</textarea>
          </div>
          <div class="mb-2">
            <label class="form-label small fw-bold mb-1">ลิงก์ YouTube (คั่นด้วยเครื่องหมาย ,)</label>
            <input type="text" class="form-control form-control-sm" id="vid_${i}" value="${l.videos ? l.videos.join(',') : ''}">
          </div>
          <div class="mb-2">
            <label class="form-label small fw-bold mb-1">ลิงก์ใบงานนักเรียน</label>
            <input type="text" class="form-control form-control-sm" id="work_${i}" value="${l.worksheetUrl || ''}">
          </div>
          
          <hr class="my-3">
          <h6 class="fw-bold text-success mb-2"><i class="bi bi-person-badge me-1"></i> ข้อมูลสำหรับคุณครู ( Teacher Mode )</h6>
          <div class="mb-2">
            <label class="form-label small fw-bold mb-1">ลิงก์ PDF คำชี้แจง/คู่มือผู้สอน</label>
            <input type="text" class="form-control form-control-sm" id="teacherPdf_${i}" value="${l.teacherPdfUrl || ''}">
          </div>
          <div class="mb-2">
            <label class="form-label small fw-bold mb-1">ลิงก์เฉลยใบงาน/กิจกรรม</label>
            <input type="text" class="form-control form-control-sm" id="answerSheet_${i}" value="${l.answerSheetUrl || ''}">
          </div>
          <div class="mb-2">
            <label class="form-label small fw-bold mb-1">ลิงก์ MakeCode เฉลยที่ถูกต้อง</label>
            <input type="text" class="form-control form-control-sm" id="solutionCode_${i}" value="${l.solutionCodeUrl || ''}">
          </div>
          <div class="mb-2">
            <label class="form-label small fw-bold mb-1">อัปโหลดรูปภาพ Block Code เฉลย</label>
            <input type="file" class="form-control form-control-sm mb-1" id="fileInput_${i}" accept="image/*" onchange="uploadSolutionImage(${i})">
            <input type="text" class="form-control form-control-sm" id="solutionImg_${i}" value="${l.solutionImgUrl || ''}" placeholder="URL รูปภาพจะแสดงที่นี่อัตโนมัติ" readonly>
          </div>
        </div>
      `;
    });
    document.getElementById('adminFormArea').innerHTML = html;
  }

  function logoutAdmin() {
    document.getElementById('adminAuthSection').style.display = 'block';
    document.getElementById('adminEditorSection').style.display = 'none';
    document.getElementById('adminModalFooter').style.display = 'none';
    document.getElementById('adminPassInput').value = '';
    document.getElementById('authAlert').innerHTML = '';
  }

  function saveAdminData() {
    let pass = document.getElementById('adminPassInput').value;
    let updated = lessonsData.map((l, i) => {
      l.title = document.getElementById(`title_${i}`).value;
      l.desc = document.getElementById(`desc_${i}`).value;
      let vidInput = document.getElementById(`vid_${i}`).value;
      l.videos = vidInput ? vidInput.split(',').map(v => v.trim()) : [];
      l.worksheetUrl = document.getElementById(`work_${i}`).value;
      
      l.teacherPdfUrl = document.getElementById(`teacherPdf_${i}`).value;
      l.answerSheetUrl = document.getElementById(`answerSheet_${i}`).value;
      l.solutionCodeUrl = document.getElementById(`solutionCode_${i}`).value;
      l.solutionImgUrl = document.getElementById(`solutionImg_${i}`).value;
      return l;
    });

    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "saveLessonData", updatedData: updated, password: pass })
    })
    .then(res => res.json())
    .then(res => {
      alert(res.message);
      if(res.success) {
        adminModalObj.hide();
        renderLessons(updated);
      }
    });
  }

  function uploadSolutionImage(index) {
    let fileInput = document.getElementById(`fileInput_${index}`);
    let urlInput = document.getElementById(`solutionImg_${index}`);
    let file = fileInput.files[0];
  
    if (!file) return;
  
    let reader = new FileReader();
    reader.onload = function(e) {
      let base64Data = e.target.result;
      urlInput.value = "กำลังอัปโหลดรูปภาพ...";
  
      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "uploadImage",
          base64Data: base64Data,
          fileName: `robocart_solution_ch${index + 1}_${Date.now()}`
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          urlInput.value = res.url;
          alert("อัปโหลดรูปภาพเรียบร้อยแล้ว!");
        } else {
          alert("เกิดข้อผิดพลาดในการอัปโหลด: " + res.message);
          urlInput.value = "";
        }
      })
      .catch(err => {
        alert("เกิดข้อผิดพลาดในการอัปโหลด: " + err.message);
        urlInput.value = "";
      });
    };
    reader.readAsDataURL(file);
  }
</script>
