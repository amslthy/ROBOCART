<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการเนื้อหา (Admin Dashboard) - ROBOCART</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Font: Prompt & Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      --bg-color: #f8fafc;
      --card-radius: 16px;
      --card-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
    }

    body {
      font-family: 'Sarabun', sans-serif;
      background-color: var(--bg-color);
      color: #1e293b;
      padding-bottom: 90px;
    }

    h1, h2, h3, h4, h5, h6, .font-heading {
      font-family: 'Prompt', sans-serif;
    }

    .navbar {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-bottom: 3px solid #eab308;
    }

    .admin-card-item {
      border: 1px solid #e2e8f0;
      border-radius: var(--card-radius);
      background: #ffffff;
      box-shadow: var(--card-shadow);
      transition: all 0.25s ease;
      overflow: hidden;
    }

    .admin-card-header {
      background-color: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
      padding: 14px 20px;
    }

    .form-control, .form-select {
      border-radius: 10px;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .btn-custom-primary {
      background: var(--primary-gradient);
      color: white;
      border-radius: 10px;
      font-weight: 600;
      font-family: 'Prompt', sans-serif;
      border: none;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .section-box-student {
      background-color: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 12px;
    }

    .section-box-teacher {
      background-color: #f0fdf4;
      border: 1px dashed #34d399;
      border-radius: 12px;
    }

    .floating-action-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-top: 1px solid #e2e8f0;
      padding: 12px 0;
      z-index: 1000;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4 py-3 shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="index.html">
      <i class="bi bi-robot text-warning fs-3"></i> 
      <span>ROBOCART <small class="fs-6 fw-normal text-warning">Admin System</small></span>
    </a>
    <a href="index.html" class="btn btn-outline-light rounded-pill px-3 shadow-sm d-flex align-items-center gap-1">
      <i class="bi bi-house-door-fill"></i> กลับสู่หน้าหลัก
    </a>
  </div>
</nav>

<div class="container">
  <div id="authSection" class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-lg p-4" style="border-radius: var(--card-radius);">
        <div class="text-center py-3">
          <i class="bi bi-shield-lock-fill text-warning display-3"></i>
          <h4 class="fw-bold mt-3 font-heading">เข้าสู่ระบบ Admin</h4>
          <p class="text-muted small">กรอกรหัสผ่านผู้ดูแลระบบเพื่อจัดการเนื้อหาบทเรียน</p>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control text-center fs-5 py-2" id="adminPassInput" placeholder="กรอกรหัสผ่าน Admin">
        </div>
        <div id="authAlert"></div>
        <button class="btn btn-custom-primary w-100 py-2 fs-6 font-heading" onclick="verifyAdminPassword()">
          เข้าสู่ระบบจัดการ
        </button>
      </div>
    </div>
  </div>

  <div id="editorSection" style="display: none;">
    <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-4 shadow-sm border">
      <span class="badge bg-success-subtle text-success border border-success px-3 py-2 rounded-pill font-heading fs-6">
        <i class="bi bi-check-circle-fill me-1"></i> เข้าสู่ระบบในฐานะ ผู้ดูแลระบบ
      </span>
      <span class="text-muted small"><i class="bi bi-info-circle me-1"></i> แก้ไขข้อมูลเรียบร้อยแล้วอย่าลืมกดกดบันทึกที่แถบด้านล่าง</span>
    </div>

    <div id="adminFormArea"></div>
  </div>
</div>

<div class="floating-action-bar" id="floatingBar" style="display: none;">
  <div class="container d-flex justify-content-between align-items-center">
    <span class="text-muted small d-none d-sm-inline">
      <i class="bi bi-pencil-square me-1"></i> โหมดแก้ไขข้อมูลบทเรียน
    </span>
    <div class="d-flex gap-2 ms-auto">
      <a href="index.html" class="btn btn-outline-secondary rounded-pill px-4 font-heading">ยกเลิก</a>
      <button class="btn btn-success rounded-pill px-4 font-heading shadow-sm" onclick="saveAdminData()">
        <i class="bi bi-save me-1"></i> บันทึกการแก้ไขทั้งหมด
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx_xYO1ZwGvGDtWjpfUKUBx5nlAuKf_r7ZnWhSlZPbcICzoInQf1pZm8UAgJduRoO9B/exec";
  let lessonsData = [];

  function verifyAdminPassword() {
    let pass = document.getElementById('adminPassInput').value;
    let alertDiv = document.getElementById('authAlert');

    if (pass === 'admin1234') {
      alertDiv.innerHTML = '';
      fetchInitialData();
    } else {
      alertDiv.innerHTML = `<div class="alert alert-danger py-2 small rounded-3 mb-3">รหัสผ่านไม่ถูกต้อง!</div>`;
    }
  }

  function fetchInitialData() {
    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getInitialData" })
    })
    .then(res => res.json())
    .then(data => {
      lessonsData = data;
      showAdminEditor();
    })
    .catch(err => console.error("Error loading data:", err));
  }

  function showAdminEditor() {
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('editorSection').style.display = 'block';
    document.getElementById('floatingBar').style.display = 'block';

    let html = '';
    lessonsData.forEach((l, i) => {
      // 🟢 เพิ่มตัวเลือกสลับตำแหน่งแสดงผลก่อน-หลัง
      let scenarioInputHtml = '';
      if ([2, 3, 4].includes(l.id)) {
        scenarioInputHtml = `
          <div class="col-md-8">
            <label class="form-label small fw-bold mb-1 text-warning-emphasis">
              <i class="bi bi-film text-warning me-1"></i>ลิงก์วิดีโอการ์ตูนสถานการณ์ ( YouTube - เฉพาะบทที่ 2, 3, 4 )
            </label>
            <input type="text" class="form-control border-warning-subtle bg-white" id="scenarioVid_${i}" value="${l.scenarioVideo || ''}" placeholder="https://www.youtube.com/watch?v=...">
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-bold mb-1 text-warning-emphasis">
              <i class="bi bi-arrows-vertical me-1"></i>ตำแหน่งจัดวางการ์ตูน
            </label>
            <select class="form-select border-warning-subtle bg-white fw-medium" id="scenarioPos_${i}">
              <option value="before" ${l.scenarioPosition !== 'after' ? 'selected' : ''}>🎬 แสดงก่อนเนื้อหาหลัก</option>
              <option value="after" ${l.scenarioPosition === 'after' ? 'selected' : ''}>🎬 แสดงหลังเนื้อหาหลัก</option>
            </select>
          </div>
        `;
      }

      html += `
        <div class="admin-card-item mb-4">
          <div class="admin-card-header d-flex justify-content-between align-items-center">
            <h6 class="fw-bold text-primary font-heading mb-0">
              <span class="badge bg-primary me-2 font-heading px-3 py-2 rounded-pill">บทที่ ${i+1}</span> ${l.title}
            </h6>
            <span class="badge bg-light text-secondary border">ID: ${l.id}</span>
          </div>
          
          <div class="p-4">
            <div class="section-box-student p-3 mb-4">
              <h6 class="fw-bold text-primary font-heading mb-3 d-flex align-items-center gap-2">
                <i class="bi bi-book-half"></i> 1. ข้อมูลบทเรียนสำหรับนักเรียน
              </h6>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label small fw-bold mb-1">ชื่อบทเรียน</label>
                  <input type="text" class="form-control" id="title_${i}" value="${l.title || ''}">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold mb-1"><i class="bi bi-file-earmark-arrow-down text-success me-1"></i>ลิงก์ใบงานนักเรียน (Google Drive)</label>
                  <input type="text" class="form-control" id="work_${i}" value="${l.worksheetUrl || ''}" placeholder="https://drive.google.com/...">
                </div>
                <div class="col-12">
                  <label class="form-label small fw-bold mb-1">รายละเอียดบทเรียน</label>
                  <textarea class="form-control" id="desc_${i}" rows="2">${l.desc || ''}</textarea>
                </div>
                ${scenarioInputHtml}
                <div class="col-12">
                  <label class="form-label small fw-bold mb-1"><i class="bi bi-youtube text-danger me-1"></i>ลิงก์วิดีโอเนื้อหาบทเรียน (หากมีหลายคลิปให้คั่นด้วยเครื่องหมาย ,)</label>
                  <input type="text" class="form-control" id="vid_${i}" value="${l.videos ? l.videos.join(',') : ''}">
                </div>
              </div>
            </div>

            <div class="section-box-teacher p-3">
              <h6 class="fw-bold text-success font-heading mb-3 d-flex align-items-center gap-2">
                <i class="bi bi-person-badge"></i> 2. สื่อและเอกสารเฉพาะโหมดคุณครู (Teacher Mode)
              </h6>
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label small fw-bold mb-1"><i class="bi bi-file-earmark-pdf text-danger me-1"></i>PDF คู่มือผู้สอน</label>
                  <input type="text" class="form-control bg-white" id="teacherPdf_${i}" value="${l.teacherPdfUrl || ''}" placeholder="https://...">
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-bold mb-1"><i class="bi bi-file-earmark-check text-success me-1"></i>เฉลยใบงาน/กิจกรรม</label>
                  <input type="text" class="form-control bg-white" id="answerSheet_${i}" value="${l.answerSheetUrl || ''}" placeholder="https://...">
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-bold mb-1"><i class="bi bi-code-slash text-primary me-1"></i>ลิงก์ MakeCode เฉลย</label>
                  <input type="text" class="form-control bg-white" id="solutionCode_${i}" value="${l.solutionCodeUrl || ''}" placeholder="https://makecode.microbit.org/...">
                </div>
                <div class="col-12">
                  <label class="form-label small fw-bold mb-1"><i class="bi bi-image text-info me-1"></i>รูปภาพ Block Code เฉลย</label>
                  <div class="input-group">
                    <input type="file" class="form-control" id="fileInput_${i}" accept="image/*" onchange="uploadSolutionImage(${i})">
                    <input type="text" class="form-control bg-white w-50" id="solutionImg_${i}" value="${l.solutionImgUrl || ''}" placeholder="URL รูปภาพจะแสดงที่นี่อัตโนมัติ" readonly>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    });
    document.getElementById('adminFormArea').innerHTML = html;
  }

  function saveAdminData() {
    let pass = document.getElementById('adminPassInput').value;
    let updated = lessonsData.map((l, i) => {
      l.title = document.getElementById(`title_${i}`).value;
      l.desc = document.getElementById(`desc_${i}`).value;
      let vidInput = document.getElementById(`vid_${i}`).value;
      l.videos = vidInput ? vidInput.split(',').map(v => v.trim()) : [];
      l.worksheetUrl = document.getElementById(`work_${i}`).value;
      
      // ดึงค่าลิงก์และตำแหน่งจัดวางการ์ตูนสถานการณ์
      let scenarioElem = document.getElementById(`scenarioVid_${i}`);
      let scenarioPosElem = document.getElementById(`scenarioPos_${i}`);
      if (scenarioElem) {
        l.scenarioVideo = scenarioElem.value;
      }
      if (scenarioPosElem) {
        l.scenarioPosition = scenarioPosElem.value;
      }
      
      l.teacherPdfUrl = document.getElementById(`teacherPdf_${i}`).value;
      l.answerSheetUrl = document.getElementById(`answerSheet_${i}`).value;
      l.solutionCodeUrl = document.getElementById(`solutionCode_${i}`).value;
      l.solutionImgUrl = document.getElementById(`solutionImg_${i}`).value;
      return l;
    });

    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "saveLessonData", updatedData: updated, password: pass })
    })
    .then(res => res.json())
    .then(res => {
      alert(res.message);
      if(res.success) {
        window.location.href = "index.html";
      }
    })
    .catch(err => {
      alert("เกิดข้อผิดพลาดในการบันทึก: " + err.message);
    });
  }

  function uploadSolutionImage(index) {
    let fileInput = document.getElementById(`fileInput_${index}`);
    let urlInput = document.getElementById(`solutionImg_${index}`);
    let file = fileInput.files[0];
    if (!file) return;
  
    let reader = new FileReader();
    reader.onload = function(e) {
      let base64Data = e.target.result;
      urlInput.value = "กำลังอัปโหลดรูปภาพ...";
  
      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "uploadImage",
          base64Data: base64Data,
          fileName: `robocart_solution_ch${index + 1}_${Date.now()}`
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          urlInput.value = res.url;
          alert("อัปโหลดรูปภาพเรียบร้อยแล้ว!");
        } else {
          alert("เกิดข้อผิดพลาดในการอัปโหลด: " + res.message);
          urlInput.value = "";
        }
      })
      .catch(err => {
        alert("เกิดข้อผิดพลาดในการอัปโหลด: " + err.message);
        urlInput.value = "";
      });
    };
    reader.readAsDataURL(file);
  }
</script>
</body>
</html>
