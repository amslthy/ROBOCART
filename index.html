<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สื่อการเรียนรู้หุ่นยนต์ ROBOCART</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Font: Prompt & Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      --bg-color: #f1f5f9;
      --card-radius: 16px;
      --card-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
      --card-hover-shadow: 0 12px 25px -5px rgba(15, 23, 42, 0.1);
    }
    
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: var(--bg-color);
      color: #1e293b;
    }

    h1, h2, h3, h4, h5, h6, .font-heading {
      font-family: 'Prompt', sans-serif;
    }

    /* Navbar UI */
    .navbar {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-bottom: 3px solid #3b82f6;
    }

    /* Custom Card Style */
    .custom-card {
      border: 1px solid #e2e8f0;
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      background: #ffffff;
      transition: all 0.25s ease-in-out;
    }

    /* Lesson Sidebar Nav */
    .lesson-nav .nav-link {
      color: #64748b;
      font-weight: 500;
      font-family: 'Prompt', sans-serif;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 8px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid transparent;
      background-color: #f8fafc;
    }

    .lesson-nav .nav-link:hover {
      background-color: #e0e7ff;
      color: var(--primary-color);
      transform: translateX(4px);
    }

    .lesson-nav .nav-link.active {
      background: var(--primary-gradient);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      border-color: transparent;
    }

    /* Teacher Section UI */
    .teacher-section {
      background: linear-gradient(180deg, #f0fdf4 0%, #dc262608 100%);
      border: 2px dashed #10b981;
      border-radius: var(--card-radius);
    }

    .teacher-card {
      border: 1px solid #a7f3d0;
      border-radius: 12px;
      background: #ffffff;
      transition: transform 0.2s ease;
    }
    .teacher-card:hover {
      transform: translateY(-2px);
    }

    /* Video Container */
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 14px;
      box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.15);
      background: #000;
    }
    
    .video-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }

    /* Buttons & Form Inputs */
    .form-control {
      border-radius: 10px;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
    }
    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .btn-custom-primary {
      background: var(--primary-gradient);
      color: white;
      border-radius: 10px;
      font-weight: 600;
      font-family: 'Prompt', sans-serif;
      border: none;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
    }
    .btn-custom-primary:hover {
      color: white;
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .badge-chapter {
      background-color: #eff6ff;
      color: #1d4ed8;
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark mb-4 py-3 shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="#">
      <i class="bi bi-robot text-warning fs-3"></i> 
      <span>ROBOCART <small class="fs-6 fw-normal text-light opacity-75">Learning Center</small></span>
    </a>
    
    <div class="d-flex gap-2">
      <button class="btn btn-warning rounded-pill px-3 shadow-sm fw-bold text-dark d-flex align-items-center gap-1" id="btnTeacherLogin" onclick="openAdminModal('teacher')">
        <i class="bi bi-person-badge-fill"></i> โหมดคุณครู
      </button>

      <button class="btn btn-outline-light rounded-pill px-3 shadow-sm d-flex align-items-center gap-1" onclick="openAdminModal('admin')">
        <i class="bi bi-gear-fill"></i> จัดการระบบ
      </button>
    </div>
  </div>
</nav>

<!-- แถบแจ้งเตือนสถานะคุณครู -->
<div class="container" id="teacherBadgeBar" style="display: none;">
  <div class="alert alert-success d-flex justify-content-between align-items-center rounded-4 shadow-sm py-2 mb-4 border-0 bg-success text-white">
    <span class="d-flex align-items-center gap-2">
      <i class="bi bi-check-circle-fill fs-5"></i>
      <div><strong>โหมดคุณครูทำงานอยู่:</strong> แสดงข้อมูลเฉลยและคู่มือผู้สอนแล้ว</div>
    </span>
    <button class="btn btn-sm btn-light text-danger rounded-pill fw-bold" onclick="logoutTeacher()">ออกจากโหมดคุณครู</button>
  </div>
</div>

<!-- Main Container -->
<div class="container mb-5">
  <div class="row g-4">
    <!-- เมนูบทเรียน Side Menu -->
    <div class="col-lg-3">
      <div class="custom-card p-3 sticky-top" style="top: 90px; z-index: 10;">
        <h6 class="fw-bold mb-3 text-uppercase text-muted small tracking-wide px-2 font-heading d-flex align-items-center gap-2">
          <i class="bi bi-journal-bookmark text-primary"></i> สารบัญบทเรียน
        </h6>
        <div class="nav flex-column lesson-nav" id="lessonTabs" role="tablist"></div>
      </div>
    </div>

    <!-- แสดงเนื้อหาบทเรียน Content Area -->
    <div class="col-lg-9">
      <div class="custom-card p-4 p-md-5" id="lessonContent">
        <div class="text-center my-5 py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="text-muted mt-3 fw-medium font-heading">กำลังโหลดเนื้อหาบทเรียน...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal ยืนยันตัวตน / Admin Editor -->
<div class="modal fade" id="adminModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content border-0 shadow-lg" style="border-radius: var(--card-radius);">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title fw-bold font-heading d-flex align-items-center gap-2" id="modalTitle">
          <i class="bi bi-shield-lock-fill text-warning"></i> ยืนยันตัวตนเข้าใช้งาน
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      
      <div class="modal-body p-4">
        <!-- หน้า Login -->
        <div id="adminAuthSection">
          <div class="text-center py-4">
            <i class="bi bi-person-check text-primary display-3"></i>
            <h5 class="fw-bold mt-3 font-heading" id="loginHeaderTitle">กรุณายืนยันตัวตน</h5>
            <p class="text-muted small">กรอกรหัสผ่านเพื่อเข้าถึงข้อมูลสำหรับคุณครู/ผู้ดูแลระบบ</p>
          </div>
          <div class="row justify-content-center">
            <div class="col-md-8 mx-auto">
              <div class="mb-3">
                <input type="password" class="form-control text-center fs-5" id="adminPassInput" placeholder="กรอกรหัสผ่าน (ค่าเริ่มต้น: admin1234)">
              </div>
              <div id="authAlert"></div>
              <button class="btn btn-custom-primary w-100 py-2 fs-6" onclick="verifyAdminPassword()">
                เข้าสู่ระบบ
              </button>
            </div>
          </div>
        </div>

        <!-- ฟอร์มแก้ไขเนื้อหา Admin Content Editor -->
        <div id="adminEditorSection" style="display: none;">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="badge bg-success-subtle text-success border border-success px-3 py-2 rounded-pill font-heading">
              <i class="bi bi-check-circle-fill me-1"></i> เข้าสู่ระบบจัดการเนื้อหา
            </span>
            <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="logoutAdmin()">ออกจากระบบ</button>
          </div>
          <div id="adminFormArea"></div>
        </div>
      </div>

      <div class="modal-footer bg-light" id="adminModalFooter" style="display: none;">
        <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">ยกเลิก</button>
        <button type="button" class="btn btn-success rounded-pill px-4 font-heading" onclick="saveAdminData()">
          <i class="bi bi-save me-1"></i> บันทึกการแก้ไข
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwQB_vrw95XTJ-7542_i7SOtkHdy1OVPEgh5RYdj3HgU3ee43fHNhGs_zwpo_PsjIGm/exec";

  let lessonsData = [];
  let currentLessonId = null;
  let adminModalObj = null;
  let isTeacherLoggedIn = false;
  let currentLoginTarget = 'teacher';

  window.onload = function() {
    adminModalObj = new bootstrap.Modal(document.getElementById('adminModal'));
    fetchInitialData();
  };

  function fetchInitialData() {
    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getInitialData" })
    })
    .then(res => res.json())
    .then(data => renderLessons(data))
    .catch(err => console.error("Error loading data:", err));
  }

  function renderLessons(data) {
    lessonsData = data;
    let tabs = '';
    data.forEach((l, idx) => {
      tabs += `
        <button class="nav-link ${idx===0?'active':''}" onclick="loadLesson(${l.id}, this)">
          <span>บทที่ ${l.id}</span>
          <i class="bi bi-chevron-right small opacity-50"></i>
        </button>`;
    });
    document.getElementById('lessonTabs').innerHTML = tabs;
    if (data.length > 0) loadLesson(data[0].id);
  }

  function loadLesson(id, btnElem) {
    currentLessonId = id;
    if(btnElem) {
      document.querySelectorAll('#lessonTabs .nav-link').forEach(b => b.classList.remove('active'));
      btnElem.classList.add('active');
    }

    let l = lessonsData.find(item => item.id === id);
    if (!l) return;

    let vids = l.videos ? l.videos.map(v => {
      let embedUrl = getEmbedYoutubeUrl(v);
      return embedUrl ? `<div class="video-container mb-3"><iframe src="${embedUrl}" allowfullscreen></iframe></div>` : '';
    }).join('') : '';

    let teacherHtml = '';
    if (isTeacherLoggedIn) {
      teacherHtml = `
        <div class="teacher-section p-4 my-4">
          <div class="d-flex align-items-center gap-2 text-success mb-3">
            <i class="bi bi-person-badge-fill fs-4"></i>
            <h5 class="fw-bold mb-0 font-heading">สื่อและเอกสารสำหรับผู้สอน (โหมดคุณครู)</h5>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <div class="teacher-card p-3 h-100">
                <h6 class="fw-bold text-dark font-heading mb-1"><i class="bi bi-file-earmark-pdf-fill text-danger me-2"></i>คู่มือคำชี้แจงผู้สอน</h6>
                <p class="text-muted small mb-3">แนวทางการจัดการเรียนรู้และวัตถุประสงค์</p>
                ${l.teacherPdfUrl ? `<a href="${l.teacherPdfUrl}" target="_blank" class="btn btn-danger btn-sm rounded-pill font-heading px-3"><i class="bi bi-download me-1"></i> ดาวน์โหลด PDF</a>` : '<span class="badge bg-light text-muted">ยังไม่มีไฟล์</span>'}
              </div>
            </div>

            <div class="col-md-6">
              <div class="teacher-card p-3 h-100">
                <h6 class="fw-bold text-dark font-heading mb-1"><i class="bi bi-file-earmark-check-fill text-success me-2"></i>เฉลยใบกิจกรรม</h6>
                <p class="text-muted small mb-3">คำตอบเฉลยประจำบทเรียน</p>
                ${l.answerSheetUrl ? `<a href="${l.answerSheetUrl}" target="_blank" class="btn btn-success btn-sm rounded-pill font-heading px-3"><i class="bi bi-file-earmark-text me-1"></i> ดูเฉลยใบงาน</a>` : '<span class="badge bg-light text-muted">ยังไม่มีไฟล์</span>'}
              </div>
            </div>

            <div class="col-12">
              <div class="teacher-card p-3">
                <h6 class="fw-bold text-dark font-heading mb-2"><i class="bi bi-code-slash text-primary me-2"></i>เฉลย Block Code ที่ถูกต้อง</h6>
                <div class="mb-3">
                  <span class="text-muted small">ลิงก์ MakeCode: </span>
                  ${l.solutionCodeUrl ? `<a href="${l.solutionCodeUrl}" target="_blank" class="fw-bold text-primary text-decoration-none">${l.solutionCodeUrl} <i class="bi bi-box-arrow-up-right small"></i></a>` : '<span class="text-muted small">ยังไม่มีลิงก์</span>'}
                </div>
                <div>
                  <div class="text-muted small mb-1">รูปภาพตัวอย่างผังบล็อกคำสั่ง:</div>
                  ${l.solutionImgUrl ? `<img src="${l.solutionImgUrl}" class="img-fluid rounded-3 border shadow-sm" style="max-height: 400px;">` : '<div class="p-3 bg-light rounded text-center text-muted small">ยังไม่ได้อัปโหลดรูปภาพเฉลย</div>'}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    let html = `
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <div>
          <span class="badge badge-chapter mb-2 font-heading">บทเรียนที่ ${l.id}</span>
          <h2 class="fw-bold text-dark font-heading mb-0">${l.title}</h2>
        </div>
        ${l.worksheetUrl ? `<a href="${l.worksheetUrl}" target="_blank" class="btn btn-outline-success rounded-pill font-heading px-3 fw-medium"><i class="bi bi-file-earmark-arrow-down-fill me-1"></i> ดาวน์โหลดใบงานนักเรียน</a>` : ''}
      </div>
      <p class="text-secondary fs-6 mb-4 leading-relaxed">${l.desc || ''}</p>

      ${teacherHtml}

      <div class="mb-4">
        <h5 class="fw-bold font-heading mb-3 d-flex align-items-center gap-2">
          <i class="bi bi-play-btn-fill text-danger"></i> วิดีโอประกอบการเรียนรู้
        </h5>
        ${vids || '<div class="p-4 bg-light rounded-3 text-center text-muted border">ยังไม่มีคลิปวิดีโอสำหรับบทเรียนนี้</div>'}
      </div>

      <!-- ส่วนตรวจโค้ด -->
      <div class="bg-light p-4 rounded-4 border">
        <h5 class="fw-bold font-heading text-dark mb-1"><i class="bi bi-check-circle text-success me-1"></i> ตรวจสอบ Block Code อัตโนมัติ</h5>
        <p class="text-muted small mb-3">วาง Project Link จาก Microsoft MakeCode เพื่อตรวจทานความถูกต้องก่อนนำโค้ดลงหุ่นยนต์</p>
        
        <form onsubmit="handleInlineCheck(event, ${l.id})">
          <div class="input-group mb-3">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-link-45deg text-muted"></i></span>
            <input type="url" class="form-control border-start-0" id="inlineCheckUrl_${l.id}" placeholder="https://makecode.microbit.org/S00000-00000-00000-00000" required>
            <button type="submit" class="btn btn-custom-primary px-4" id="btnInlineCheck_${l.id}">
              ตรวจสอบโค้ด
            </button>
          </div>
        </form>
        <div id="inlineCheckResult_${l.id}"></div>
      </div>
    `;

    document.getElementById('lessonContent').innerHTML = html;
  }

  function getEmbedYoutubeUrl(url) {
    if (!url) return '';
    url = url.trim();
    let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    let match = url.match(regExp);
    return (match && match[2].length === 11) ? 'https://www.youtube.com/embed/' + match[2] : url;
  }

  function handleInlineCheck(event, chapterId) {
    event.preventDefault();
    let urlInput = document.getElementById(`inlineCheckUrl_${chapterId}`);
    let btn = document.getElementById(`btnInlineCheck_${chapterId}`);
    let resDiv = document.getElementById(`inlineCheckResult_${chapterId}`);

    btn.disabled = true;
    resDiv.innerHTML = `<div class="p-3 text-center text-muted bg-white rounded-3 border mt-2"><div class="spinner-border spinner-border-sm text-primary me-2"></div> กำลังวิเคราะห์ Block Code...</div>`;

    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "checkCode", chapterId: chapterId, shareUrl: urlInput.value })
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      if(!res.success) {
        resDiv.innerHTML = `<div class="alert alert-danger rounded-3 mb-0 mt-2">${res.message}</div>`;
      } else if(res.passed) {
        resDiv.innerHTML = `<div class="alert alert-success rounded-3 mb-0 mt-2"><h6 class="fw-bold font-heading mb-1"><i class="bi bi-patch-check-fill me-1"></i> ตรวจสอบผ่าน</h6><p class="mb-0 small">${res.message}</p></div>`;
      } else {
        let list = res.feedback.map(f => `<li>${f}</li>`).join('');
        resDiv.innerHTML = `<div class="alert alert-warning rounded-3 mb-0 mt-2"><h6 class="fw-bold font-heading mb-1"><i class="bi bi-exclamation-triangle-fill me-1"></i> จุดที่ต้องแก้ไขเพิ่มเติม:</h6><ul class="mb-0 ps-3 small">${list}</ul></div>`;
      }
    })
    .catch(err => {
      btn.disabled = false;
      resDiv.innerHTML = `<div class="alert alert-danger rounded-3 mb-0 mt-2">เกิดข้อผิดพลาดในการเชื่อมต่อ: ${err.message}</div>`;
    });
  }

  function openAdminModal(target) {
    currentLoginTarget = target;
    logoutAdmin();
    document.getElementById('loginHeaderTitle').innerText = target === 'teacher' ? 'เข้าสู่ระบบโหมดคุณครู' : 'เข้าสู่ระบบจัดการเนื้อหา (Admin)';
    adminModalObj.show();
  }

  function verifyAdminPassword() {
    let pass = document.getElementById('adminPassInput').value;
    let alertDiv = document.getElementById('authAlert');

    if (pass === 'admin1234') {
      alertDiv.innerHTML = '';
      if (currentLoginTarget === 'teacher') {
        isTeacherLoggedIn = true;
        document.getElementById('teacherBadgeBar').style.display = 'block';
        document.getElementById('btnTeacherLogin').style.display = 'none';
        adminModalObj.hide();
        loadLesson(currentLessonId);
      } else {
        showAdminEditor();
      }
    } else {
      alertDiv.innerHTML = `<div class="alert alert-danger py-2 small rounded-3">รหัสผ่านไม่ถูกต้อง!</div>`;
    }
  }

  function logoutTeacher() {
    isTeacherLoggedIn = false;
    document.getElementById('teacherBadgeBar').style.display = 'none';
    document.getElementById('btnTeacherLogin').style.display = 'inline-flex';
    loadLesson(currentLessonId);
  }

  function showAdminEditor() {
    document.getElementById('adminAuthSection').style.display = 'none';
    document.getElementById('adminEditorSection').style.display = 'block';
    document.getElementById('adminModalFooter').style.display = 'flex';

    let html = '';
    lessonsData.forEach((l, i) => {
      html += `
        <div class="card p-3 mb-3 bg-light border-0 shadow-sm rounded-3">
          <h6 class="fw-bold text-primary font-heading mb-3"><i class="bi bi-journal-text me-1"></i> บทเรียนที่ ${i+1}: ${l.title}</h6>
          <div class="mb-2">
            <label class="form-label small fw-bold mb-1">ชื่อบทเรียน</label>
            <input type="text" class="form-control form-control-sm" id="title_${i}" value="${l.title || ''}">
          </div>
          <div class="mb-2">
            <label class="form-label small fw-bold mb-1">รายละเอียดบทเรียน</label>
            <textarea class="form-control form-control-sm" id="desc_${i}" rows="2">${l.desc || ''}</textarea>
          </div>
          <div class="mb-2">
            <label class="form-label small fw-bold mb-1">ลิงก์ YouTube (คั่นด้วยเครื่องหมาย ,)</label>
            <input type="text" class="form-control form-control-sm" id="vid_${i}" value="${l.videos ? l.videos.join(',') : ''}">
          </div>
          <div class="mb-2">
            <label class="form-label small fw-bold mb-1">ลิงก์ใบงานนักเรียน</label>
            <input type="text" class="form-control form-control-sm" id="work_${i}" value="${l.worksheetUrl || ''}">
          </div>
          
          <hr class="my-3">
          <h6 class="fw-bold text-success font-heading mb-2"><i class="bi bi-person-badge me-1"></i> ข้อมูลสำหรับคุณครู ( Teacher Mode )</h6>
          <div class="mb-2">
            <label class="form-label small fw-bold mb-1">ลิงก์ PDF คำชี้แจง/คู่มือผู้สอน</label>
            <input type="text" class="form-control form-control-sm" id="teacherPdf_${i}" value="${l.teacherPdfUrl || ''}">
          </div>
          <div class="mb-2">
            <label class="form-label small fw-bold mb-1">ลิงก์เฉลยใบงาน/กิจกรรม</label>
            <input type="text" class="form-control form-control-sm" id="answerSheet_${i}" value="${l.answerSheetUrl || ''}">
          </div>
          <div class="mb-2">
            <label class="form-label small fw-bold mb-1">ลิงก์ MakeCode เฉลยที่ถูกต้อง</label>
            <input type="text" class="form-control form-control-sm" id="solutionCode_${i}" value="${l.solutionCodeUrl || ''}">
          </div>
          <div class="mb-2">
            <label class="form-label small fw-bold mb-1">อัปโหลดรูปภาพ Block Code เฉลย</label>
            <input type="file" class="form-control form-control-sm mb-1" id="fileInput_${i}" accept="image/*" onchange="uploadSolutionImage(${i})">
            <input type="text" class="form-control form-control-sm" id="solutionImg_${i}" value="${l.solutionImgUrl || ''}" placeholder="URL รูปภาพจะแสดงที่นี่อัตโนมัติ" readonly>
          </div>
        </div>
      `;
    });
    document.getElementById('adminFormArea').innerHTML = html;
  }

  function logoutAdmin() {
    document.getElementById('adminAuthSection').style.display = 'block';
    document.getElementById('adminEditorSection').style.display = 'none';
    document.getElementById('adminModalFooter').style.display = 'none';
    document.getElementById('adminPassInput').value = '';
    document.getElementById('authAlert').innerHTML = '';
  }

  function saveAdminData() {
    let pass = document.getElementById('adminPassInput').value;
    let updated = lessonsData.map((l, i) => {
      l.title = document.getElementById(`title_${i}`).value;
      l.desc = document.getElementById(`desc_${i}`).value;
      let vidInput = document.getElementById(`vid_${i}`).value;
      l.videos = vidInput ? vidInput.split(',').map(v => v.trim()) : [];
      l.worksheetUrl = document.getElementById(`work_${i}`).value;
      
      l.teacherPdfUrl = document.getElementById(`teacherPdf_${i}`).value;
      l.answerSheetUrl = document.getElementById(`answerSheet_${i}`).value;
      l.solutionCodeUrl = document.getElementById(`solutionCode_${i}`).value;
      l.solutionImgUrl = document.getElementById(`solutionImg_${i}`).value;
      return l;
    });

    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "saveLessonData", updatedData: updated, password: pass })
    })
    .then(res => res.json())
    .then(res => {
      alert(res.message);
      if(res.success) {
        adminModalObj.hide();
        renderLessons(updated);
      }
    });
  }

  function uploadSolutionImage(index) {
    let fileInput = document.getElementById(`fileInput_${index}`);
    let urlInput = document.getElementById(`solutionImg_${index}`);
    let file = fileInput.files[0];
  
    if (!file) return;
  
    let reader = new FileReader();
    reader.onload = function(e) {
      let base64Data = e.target.result;
      urlInput.value = "กำลังอัปโหลดรูปภาพ...";
  
      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "uploadImage",
          base64Data: base64Data,
          fileName: `robocart_solution_ch${index + 1}_${Date.now()}`
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          urlInput.value = res.url;
          alert("อัปโหลดรูปภาพเรียบร้อยแล้ว!");
        } else {
          alert("เกิดข้อผิดพลาดในการอัปโหลด: " + res.message);
          urlInput.value = "";
        }
      })
      .catch(err => {
        alert("เกิดข้อผิดพลาดในการอัปโหลด: " + err.message);
        urlInput.value = "";
      });
    };
    reader.readAsDataURL(file);
  }
</script>
</body>
</html>
